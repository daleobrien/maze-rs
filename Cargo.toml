[package]
name = "maze"
version = "3.0.0"
edition = "2021"
description = "Application that generates weave mazes (Rust port of the Python maze generator)"
license = "MIT"

[features]
default = ["pdf", "cli"]
# Compressed PDF output. Without it (as in WebAssembly) PDFs are written
# uncompressed and the library needs nothing outside the standard library.
pdf = ["dep:flate2"]
# The `maze` command line program, which makes up random maze ids.
cli = ["pdf", "dep:uuid"]

[dependencies]
flate2 = { version = "1", default-features = false, features = ["zlib-rs"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

[[bin]]
name = "maze"
path = "src/main.rs"
required-features = ["cli"]

[dev-dependencies]
criterion = "0.5"
sha2 = "0.10"

[[bench]]
name = "maze"
harness = false

[profile.release]
lto = "fat"
codegen-units = 1

[profile.bench]
lto = "fat"
codegen-units = 1
