[package]
name = "maze"
version = "3.0.0"
edition = "2021"
description = "Application that generates weave mazes (Rust port of the Python maze generator)"
license = "MIT"

[dependencies]
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
criterion = "0.5"
sha2 = "0.10"

[[bench]]
name = "maze"
harness = false

[profile.release]
lto = "fat"
codegen-units = 1

[profile.bench]
lto = "fat"
codegen-units = 1
